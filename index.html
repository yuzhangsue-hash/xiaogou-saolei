<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫雷</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:20px;color:#1e293b}button{cursor:pointer} .toolbar,.stats{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.act{border:1px solid #94a3b8;background:white;border-radius:7px;padding:8px 11px}.active{background:#2563eb;color:white;border-color:#2563eb}.board-wrap{overflow:auto;border:1px solid #94a3b8;border-radius:8px;padding:8px;background:#e2e8f0;max-width:100%}#board{display:grid;width:max-content}.tile{width:25px;height:25px;min-width:25px;display:flex;align-items:center;justify-content:center;border:1px solid #94a3b8;border-radius:2px;font-size:15px;font-weight:750;cursor:pointer;user-select:none;touch-action:manipulation;padding:0}.covered{background:#cbd5e1;box-shadow:inset -2px -2px #94a3b8,inset 2px 2px #f8fafc}.open{background:#f1f5f9}.flagged{background:#fee2e2}.hinted{outline:3px solid #f59e0b;outline-offset:-3px}.n1{color:#2563eb}.n2{color:#15803d}.n3{color:#dc2626}.n4{color:#7c3aed}.n5{color:#b45309}.n6{color:#0891b2}.n7{color:#334155}.n8{color:#111827}#status,#report{padding:12px;border-radius:8px;background:#f1f5f9;margin-top:12px;line-height:1.6}#report{border:1px solid #cbd5e1}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.report-grid strong{display:block;font-size:22px}small{color:#64748b}
/* 小狗主题：只改变呈现，不改变棋盘与推理逻辑。 */
:root{color-scheme:light;--ink:#493b50;--pink:#ffe0e8;--rose:#e46d96;--cream:#fffaf3;--mint:#d8f3e8;--line:#d6bfc9}
*{box-sizing:border-box}
body{max-width:1120px;margin:0 auto;padding:26px 18px 48px;color:var(--ink);background:radial-gradient(circle at 8% 6%,#fff0d7 0 9%,transparent 30%),radial-gradient(circle at 93% 12%,#ffe4eb 0 8%,transparent 29%),linear-gradient(145deg,#fffaf4,#fff2f5 54%,#f1fff8);min-height:100vh}
body:before{content:'🐾  ✦  🦴  ✦  🐾';position:absolute;right:max(18px,calc((100vw - 1120px)/2));top:20px;color:#cc9eac;letter-spacing:7px;font-size:20px;pointer-events:none}
h2{display:inline-block;margin:8px 0 6px;padding:13px 23px 13px 18px;border-radius:24px 24px 24px 8px;background:#fff;box-shadow:0 8px 28px #b9718f20;font-size:clamp(22px,4vw,31px);line-height:1.2}
.toolbar,.stats{gap:10px;margin-bottom:13px}
.toolbar{padding:12px 14px;border:1px solid #f1dbe3;border-radius:18px;background:#ffffffd9;box-shadow:0 6px 20px #bc8da119}
.toolbar strong{margin-right:4px;color:#79576a}
#touchControls{display:none}
.touch-help{display:none}
#touchControls .act[aria-pressed="true"]{background:#f48fb1;color:#482c3b;border-color:#e67ca1;box-shadow:0 3px 0 #d87395}
#touchControls small{flex-basis:100%;line-height:1.4}
@media(pointer:coarse){:root{--tile-size:32px}#touchControls{display:flex}.touch-help{display:inline}.desktop-help{display:none}}
.act{border:1px solid #edc9d7;border-radius:13px;padding:9px 14px;background:#fff8fb;color:#6b4b5d;font-weight:700;box-shadow:0 3px 0 #efd7df;transition:transform .12s,background .12s,box-shadow .12s}
.act:hover:not(:disabled){transform:translateY(-2px);background:#fff0f5;box-shadow:0 5px 0 #efd7df}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #efd7df}
.act:disabled{opacity:.55;cursor:not-allowed}
.act.active{background:#f48fb1;color:#482c3b;border-color:#e67ca1;box-shadow:0 3px 0 #d87395}
#new{background:#e1f6ec;border-color:#b6ddc9;box-shadow:0 3px 0 #b9dfca}
#hint,#explain{background:#fff2cf;border-color:#e8d5a6;box-shadow:0 3px 0 #e7d5ad}
.stats>strong{display:flex;align-items:center;gap:6px;padding:11px 16px;border:1px solid #e9d2dc;border-radius:16px;background:#fff;box-shadow:0 5px 16px #b9759120;font-size:14px}
.stats>strong:nth-child(1):before{content:'💣';font-size:17px}
.stats>strong:nth-child(2):before{content:'🌼';font-size:17px}
.stats span{font-size:18px;color:#b14e78}
.board-wrap{border:3px solid #f4cad9;border-radius:22px;padding:16px;background:linear-gradient(135deg,#fff8fb,#f2fff7);box-shadow:0 12px 30px #b975912e;scrollbar-color:#d894ad #fff5f8}
#board{gap:1px;padding:5px;border-radius:11px;background:#dabfc9;box-shadow:0 3px 0 #c39dab}
.tile{width:var(--tile-size,25px);height:var(--tile-size,25px);min-width:var(--tile-size,25px);border:1px solid #dec2ce;border-radius:5px;font-size:15px;transition:filter .1s,transform .1s}
.tile:hover{filter:brightness(1.045)}
.tile.covered{background:#fbd6e3;box-shadow:inset -2px -2px #e9acc2,inset 2px 2px #fff4f8}
.tile.open{background:#fffdf8;border-color:#e8d8dc;box-shadow:none}
.tile.flagged{background:#ffe8b7;color:#bd526b!important}
.tile.hinted{outline:3px solid #ed9a47;outline-offset:-2px}
#status,#report{background:#fff;border:1px solid #efd4de;border-radius:17px;padding:13px 16px;box-shadow:0 6px 18px #b9759117}
#status:empty{display:none}
#status:before{content:'🐶 ';margin-right:4px}
#report{background:#fffaf0}
#report .report-grid>div{padding:8px;border-radius:12px;background:#fff}
small{color:#806d77}
#victoryDogCard{border:4px solid #ffd8e6!important;background:#fffbf5!important;border-radius:24px!important}
#victoryDogCard h3{color:#a74771;font-size:25px}
#victoryDogCard h3:before{content:'🐾 ';}
#victoryDogAgain{background:#f48fb1!important;border-color:#df759b!important;color:#422b39!important;font-size:17px;font-weight:800;padding:11px 22px!important}
@media(max-width:600px){body{padding:13px 10px 32px}body:before{font-size:13px;letter-spacing:2px;top:17px}h2{padding:12px 15px;font-size:21px;max-width:100%}.toolbar{padding:10px;gap:8px}.act{padding:8px 10px;font-size:13px}.stats>strong{padding:8px 10px}.board-wrap{padding:9px;border-radius:15px}#board{padding:3px}}
</style></head><body>
<h2>🐶 扫雷</h2>
<div class="toolbar"><strong>难度</strong><button class="act" id="easy">初级</button><button class="act" id="medium">中级</button><button class="act" id="hard">高级</button><button class="act" id="new">重新开局</button></div>
<div class="stats"><strong>地雷 <span id="left">99</span></strong><strong>已翻开 <span id="opened">0</span>/<span id="safe">381</span></strong></div>
<div class="toolbar"><button class="act" id="undo">撤销上一步</button><button class="act" id="check">检查旗子</button><button class="act" id="hint">下一步提示</button><button class="act" id="explain">解释推理</button></div>
<div class="toolbar" id="touchControls" role="group" aria-label="触屏操作模式"><strong>触屏操作</strong><button class="act" id="touchReveal" type="button" aria-pressed="true">👆 翻开</button><button class="act" id="touchFlag" type="button" aria-pressed="false">🚩 插旗</button><small>选择操作后，轻触格子即可；再次轻触已插旗格子可取消旗子。</small></div>
<div class="board-wrap"><div id="board"></div></div>
<div id="status" aria-live="polite"></div>
<div id="report" hidden><strong>手动检查结果</strong> <small id="report-state">当前统计</small><div class="report-grid"><div>正确旗数<strong id="correct">0</strong></div><div>错误旗数<strong id="wrong">0</strong></div><div>未标记雷数<strong id="missing">99</strong></div></div><small>仅显示数量，不指出错误位置。检查不影响继续游戏。</small></div>
<p><small class="desktop-help">左键翻开，右键插旗；Mac 触控板双指轻点可插旗。踩雷后可撤销。</small><small class="touch-help">手机上先选“翻开”或“插旗”，再轻触格子；踩雷后可撤销。</small></p>

<style>
#victoryDogOverlay{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#victoryDogOverlay.visible{display:flex}#victoryDogCard{position:relative;background:#fff;border-radius:18px;padding:18px;width:min(92vw,520px);box-shadow:0 18px 70px #0005;text-align:center}#victoryDogCard img{width:100%;height:auto;max-height:65vh;object-fit:contain;border-radius:12px}#victoryDogCard h3{margin:0 0 12px}#victoryDogCard button{padding:9px 15px;border-radius:8px;border:1px solid #aaa;background:#f8fafc;margin:10px 4px 0}
</style>
<div id="victoryDogOverlay" role="dialog" aria-modal="true" aria-label="通关庆祝动画"><div id="victoryDogCard"><h3>通关成功！</h3><img id="victoryDogImage" alt="双狗通关庆祝动画"><div><button id="victoryDogAgain">再来一局</button></div></div></div>

<script>
(function(){
const $=id=>document.getElementById(id),board=$('board');
let touchMode='reveal';
function setTouchMode(mode){touchMode=mode;$('touchReveal').setAttribute('aria-pressed',String(mode==='reveal'));$('touchFlag').setAttribute('aria-pressed',String(mode==='flag'));}
$('touchReveal').onclick=()=>setTouchMode('reveal');$('touchFlag').onclick=()=>setTouchMode('flag');
const victoryDogFiles=["./dogs/dog-01.gif", "./dogs/dog-02.gif", "./dogs/dog-03.gif", "./dogs/dog-04.gif", "./dogs/dog-05.gif", "./dogs/dog-06.gif", "./dogs/dog-07.gif", "./dogs/dog-08.gif", "./dogs/dog-09.gif", "./dogs/dog-10.gif"];
let lastVictoryDog=-1,victoryTimer=null,victoryGeneration=0,preparedVictoryDog=-1,preparedVictoryFrames=[],preparedVictoryLoad=null;
function prepareVictoryDog(){
 let i=Math.floor(Math.random()*victoryDogFiles.length);
 if(victoryDogFiles.length>1&&i===lastVictoryDog)i=(i+1+Math.floor(Math.random()*(victoryDogFiles.length-1)))%victoryDogFiles.length;
 preparedVictoryDog=i;
 const name='dog-'+String(i+1).padStart(2,'0');
 preparedVictoryFrames=Array.from({length:6},(_,frame)=>'./dogs/frames/'+name+'-'+frame+'.webp');
 preparedVictoryLoad=Promise.all(preparedVictoryFrames.map(src=>new Promise((resolve,reject)=>{const preload=new Image();preload.onload=resolve;preload.onerror=reject;preload.src=src;})));
 preparedVictoryLoad.catch(()=>{});
}
function closeVictoryDog(){victoryGeneration++;clearInterval(victoryTimer);victoryTimer=null;$('victoryDogOverlay').classList.remove('visible');$('victoryDogImage').removeAttribute('src');}
function showVictoryDog(){
 if(preparedVictoryDog<0)prepareVictoryDog();
 const i=preparedVictoryDog,frames=preparedVictoryFrames;
 lastVictoryDog=i;
 const generation=++victoryGeneration,img=$('victoryDogImage');
 img.onerror=()=>{img.onerror=()=>say('动画加载失败，请重新打开本网页。');img.src=victoryDogFiles[i];};
 img.src=frames[0];
 $('victoryDogOverlay').classList.add('visible');
 preparedVictoryLoad.then(()=>{
  if(generation!==victoryGeneration)return;
  clearInterval(victoryTimer);
  let frame=0;
  victoryTimer=setInterval(()=>{if(generation!==victoryGeneration){clearInterval(victoryTimer);return;}frame=(frame+1)%frames.length;img.src=frames[frame];},i<7?180:220);
 }).catch(()=>{if(generation===victoryGeneration)img.src=victoryDogFiles[i];});
}

$('victoryDogAgain').onclick=()=>{closeVictoryDog();reset();};

const levels={easy:[9,9,10],medium:[16,16,40],hard:[16,30,99]};
let level='hard',R=16,C=30,M=99,N=480,SAFE=381;
let cells=[],started=false,done=false,hit=-1,flags=0,opened=0,history=[],undos=0,hintAt=-1,hintText='',reportFresh=false;
const adj=i=>{const r=Math.floor(i/C),c=i%C,out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C)out.push(rr*C+cc)}return out};
const pos=i=>'第'+(Math.floor(i/C)+1)+'行、第'+(i%C+1)+'列';
const say=s=>$('status').textContent=s;
function save(){history.push({cells:cells.map(x=>({...x})),started,done,hit,flags,opened});}
function stale(){if(reportFresh){reportFresh=false;$('report-state').textContent='已过期，请重新检查';}}
function reset(l=level){level=l;[R,C,M]=levels[level];N=R*C;SAFE=N-M;cells=Array.from({length:N},()=>({mine:false,n:0,open:false,flag:false}));started=false;done=false;hit=-1;flags=0;opened=0;history=[];undos=0;hintAt=-1;hintText='';reportFresh=false;$('report').hidden=true;for(const k of Object.keys(levels))$(k).classList.toggle('active',k===level);board.style.gridTemplateColumns='repeat('+C+',var(--tile-size,25px))';board.style.gridTemplateRows='repeat('+R+',var(--tile-size,25px))';$('safe').textContent=SAFE;say('');render();prepareVictoryDog();}
function place(first){const banned=new Set([first,...adj(first)]),pool=[];for(let i=0;i<N;i++)if(!banned.has(i))pool.push(i);for(let k=0;k<M;k++){let j=k+Math.floor(Math.random()*(pool.length-k));[pool[k],pool[j]]=[pool[j],pool[k]];cells[pool[k]].mine=true;}for(let i=0;i<N;i++)cells[i].n=adj(i).filter(j=>cells[j].mine).length;started=true;}
function reveal(i){if(done||cells[i].open||cells[i].flag)return;save();if(!started)place(i);stale();hintAt=-1;if(cells[i].mine){done=true;hit=i;say('踩雷：'+pos(i)+'。点击「撤销上一步」可恢复踩雷前状态，原雷区不变。');render();return;}const q=[i],seen=new Set();while(q.length){const j=q.pop();if(seen.has(j)||cells[j].open||cells[j].flag||cells[j].mine)continue;seen.add(j);cells[j].open=true;opened++;if(cells[j].n===0)for(const x of adj(j))if(!cells[x].open&&!cells[x].flag)q.push(x);}if(opened===SAFE){done=true;hit=-1;say('通关！全部安全格已翻开。');showVictoryDog();requestAnimationFrame(()=>requestAnimationFrame(render));return;}say('已翻开 '+opened+' 格。继续推理，或使用下一步提示。');render();}
function flag(i){if(done||cells[i].open)return;save();cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;hintAt=-1;stale();render();}
function undo(){if(!history.length){say('没有可以撤销的操作。');return;}const s=history.pop();cells=s.cells;started=s.started;done=s.done;hit=s.hit;flags=s.flags;opened=s.opened;hintAt=-1;hintText='';undos++;stale();say('已撤销上一步。雷区布局保持不变（若撤销首次点击，则返回尚未布雷状态）。');render();}
function render(){board.innerHTML='';for(let i=0;i<N;i++){const c=cells[i],el=document.createElement('button');el.type='button';el.className='tile '+(c.open?'open':'covered')+(c.flag?' flagged':'')+(hintAt===i?' hinted':'');el.setAttribute('aria-label',pos(i)+(c.open?' 已翻开':c.flag?' 已插旗':' 未知'));if(i===hit){el.textContent='✹';el.style.background='#fca5a5';}else if(c.open){if(c.mine){el.textContent='✹';el.style.background='#fca5a5';}else if(c.n){el.textContent=c.n;el.classList.add('n'+c.n);}}else if(c.flag){el.textContent='⚑';el.style.color='#dc2626';}el.addEventListener('click',()=>{if(matchMedia('(pointer:coarse)').matches&&touchMode==='flag')flag(i);else reveal(i)});el.addEventListener('contextmenu',e=>{e.preventDefault();flag(i)});board.appendChild(el);}$('left').textContent=M-flags;$('opened').textContent=opened;$('undo').disabled=!history.length;}
function check(){if(!started){say('请先翻开一格，再检查旗子。');return;}let good=0,bad=0;for(const c of cells)if(c.flag){if(c.mine)good++;else bad++;}$('correct').textContent=good;$('wrong').textContent=bad;$('missing').textContent=M-good;$('report-state').textContent='当前统计';$('report').hidden=false;reportFresh=true;say('检查完成：正确 '+good+' 旗，错误 '+bad+' 旗，未标记雷数 '+(M-good)+'。不暴露错误位置。');}
function constraints(){const out=[];for(let i=0;i<N;i++)if(cells[i].open&&!cells[i].mine&&cells[i].n){const near=adj(i),unknown=near.filter(j=>!cells[j].open&&!cells[j].flag),rem=cells[i].n-near.filter(j=>cells[j].flag).length;if(unknown.length)out.push({i,unknown,rem});}return out;}
function hint(){if(!started){say('先翻开一个格子。');return;}if(done){say(hit>=0?'先撤销踩雷的那一步。':'本局已经通关。');return;}const cs=constraints(),candidates=[];for(const c of cs){if(c.rem===0)for(const j of c.unknown)candidates.push({j,type:'safe',why:pos(c.i)+' 的数字已由周围旗子满足，其他相邻未知格安全。'});if(c.rem===c.unknown.length)for(const j of c.unknown)candidates.push({j,type:'mine',why:pos(c.i)+' 还缺 '+c.rem+' 颗雷，恰好剩下 '+c.unknown.length+' 个未知格，所以全部是雷。'});}for(let a=0;a<cs.length;a++)for(let b=a+1;b<cs.length;b++)for(const [s,l] of [[cs[a],cs[b]],[cs[b],cs[a]]]){if(s.unknown.length>l.unknown.length||!s.unknown.every(j=>l.unknown.includes(j)))continue;const ss=new Set(s.unknown),diff=l.unknown.filter(j=>!ss.has(j)),rem=l.rem-s.rem;if(!diff.length)continue;if(rem===0||rem===diff.length)for(const j of diff)candidates.push({j,type:rem===0?'safe':'mine',why:pos(s.i)+' 与 '+pos(l.i)+' 的未知范围相减，多出的 '+diff.length+' 格需要 '+rem+' 颗雷。'});}const h=candidates.find(x=>x.type==='safe')||candidates.find(x=>x.type==='mine');if(!h){hintAt=-1;hintText='当前没有找到单数字或两区域相减可以直接证明的格子。可能需要多条件推理或概率判断。';say(hintText);render();return;}hintAt=h.j;hintText=(h.type==='safe'?'确定安全：':'确定有雷：')+pos(h.j)+'。'+h.why;say(hintText);render();}
$('easy').onclick=()=>reset('easy');$('medium').onclick=()=>reset('medium');$('hard').onclick=()=>reset('hard');$('new').onclick=()=>reset();$('undo').onclick=undo;$('check').onclick=check;$('hint').onclick=hint;$('explain').onclick=()=>say(hintText||'先点击「下一步提示」，查看推理依据。');reset();
})();
</script></body></html>
